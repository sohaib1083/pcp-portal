# PCP Digital Portal login theme (CSS-only; templates come from the stock "keycloak" theme).
# Resources resolve up the parent chain, so css/login.css is served from the parent theme.
parent=keycloak
import=common/keycloak

stylesCommon=node_modules/@patternfly/patternfly/patternfly.min.css node_modules/patternfly/dist/css/patternfly.min.css node_modules/patternfly/dist/css/patternfly-additions.min.css lib/pficon/pficon.css
styles=css/login.css css/pcp.css

meta=viewport==width=device-width,initial-scale=1
