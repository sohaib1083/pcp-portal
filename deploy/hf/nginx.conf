# Single-container front door on :7860 (Hugging Face terminates HTTPS in front of it). Runs as a normal user.
worker_processes 2;
pid /data/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path /data/nginx-body;
  proxy_temp_path /data/nginx-proxy;
  fastcgi_temp_path /data/nginx-fcgi;
  uwsgi_temp_path /data/nginx-uwsgi;
  scgi_temp_path /data/nginx-scgi;
  client_max_body_size 25m;
  gzip on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;
  proxy_buffer_size 128k;
  proxy_buffers 4 256k;
  proxy_busy_buffers_size 256k;

  server {
    listen 7860;
    # Keycloak's master realm and admin console are never public.
    location ~ ^/auth/(realms|admin|resources/[^/]+/admin)/master(/|$) { return 404; }
    location ~ ^/auth/admin/[^/]+/console { return 404; }

    location /auth/ {
      proxy_pass http://127.0.0.1:8080/auth/;
      proxy_set_header Host __HOST__;
      proxy_set_header X-Forwarded-Host __HOST__;
      proxy_set_header X-Forwarded-Proto __PROTO__;
      proxy_set_header X-Forwarded-Port __PORT__;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
      proxy_pass http://127.0.0.1:3150;
      proxy_set_header Host __HOST__;
      proxy_set_header X-Forwarded-Host __HOST__;
      proxy_set_header X-Forwarded-Proto __PROTO__;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
