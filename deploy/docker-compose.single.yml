# Hosted demo on one VM: Caddy (HTTPS, automatic certificate) in front of the all-in-one PCP container
# (deploy/hf: PostgreSQL, Keycloak, the app and Nginx on :7860). The demo data resets when the container restarts.
name: pcp
services:
  pcp:
    build: ./space
    image: pcp-portal
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: https://${PUBLIC_HOST}
      # A hosted POC: everyone signs in with their own password (no one-click persona entry).
      QUICK_LOGIN: ${QUICK_LOGIN:-on}
      POC_PASSWORD_SEED: ${POC_PASSWORD_SEED:-}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Written by the deploy script: HTTPS for PUBLIC_HOST, and a redirect from the cloud's own name if different.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        # The app calls Keycloak at its public address; inside the stack that name points at Caddy.
        aliases:
          - ${PUBLIC_HOST}
    depends_on:
      - pcp

volumes:
  caddy_data:
  caddy_config:
