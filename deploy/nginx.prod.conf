# Behind a public HTTPS tunnel (./demo.sh share) the tunnel sends X-Forwarded-Proto: https.
# Pass it on, so the app sets secure cookies and Keycloak builds https links.
map $http_x_forwarded_proto $fwd_proto_hdr {
  default $http_x_forwarded_proto;
  ""      $scheme;
}
# Anything not addressed to this machine arrives through the HTTPS tunnel.
map $is_local $fwd_proto {
  1       $fwd_proto_hdr;
  default https;
}
map $fwd_proto $fwd_port {
  https   443;
  default 8088;
}
# Keycloak's master realm and admin console stay on this machine only (admin/admin is a demo default).
map $http_host $is_local {
  default            0;
  "localhost:8088"   1;
  "127.0.0.1:8088"   1;
}

server {
  listen 80;
  client_max_body_size 25m;

  # Compress text assets: Keycloak's stock stylesheets are large and uncompressed, which is slow over a tunnel.
  gzip on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

  # Master realm login and admin console: this machine only
  location ~ ^/auth/(realms|admin|resources/[^/]+/admin)/master(/|$) {
    if ($is_local = 0) { return 404; }
    proxy_pass http://keycloak:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-Port $fwd_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
  }

  # Keycloak (logins, roles, MFA)
  location /auth/ {
    proxy_pass http://keycloak:8080/auth/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-Port $fwd_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
  }

  # Next.js app (screens + server)
  location / {
    proxy_pass http://app:3150;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
  }
}
