# Production-style stack for the hosted demo: Caddy (HTTPS) -> Nginx -> Next.js app + Keycloak; PostgreSQL.
# Used by deploy/deploy.sh on the server; values come from deploy/.env (generated, never committed).
name: pcp
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pcp
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: pcp
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcp -d pcp"]
      interval: 5s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: pcp
      KC_DB_PASSWORD: ${PG_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./realm-pcp.json:/opt/keycloak/data/import/realm-pcp.json:ro
      - ../docker/keycloak/themes/pcp:/opt/keycloak/themes/pcp:ro
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://pcp:${PG_PASSWORD}@postgres:5432/pcp
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: https://${PUBLIC_HOST}
      AUTH_TRUST_HOST: "true"
      AUTH_KEYCLOAK_ID: pcp-portal
      AUTH_KEYCLOAK_SECRET: ${PORTAL_CLIENT_SECRET}
      AUTH_KEYCLOAK_ISSUER: https://${PUBLIC_HOST}/auth/realms/pcp
      PUBLIC_BASE_URL: https://${PUBLIC_HOST}
      STORAGE_DIR: /app/storage
      KEYCLOAK_ADMIN_CLIENT_ID: pcp-admin-api
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${ADMIN_API_CLIENT_SECRET}
      DEMO_MODE: "1"
      KEYCLOAK_DEMO_CLIENT_ID: pcp-demo
      KEYCLOAK_DEMO_CLIENT_SECRET: ${DEMO_CLIENT_SECRET}
      RESEED: ${RESEED:-0}
    volumes:
      - appstorage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  backup:
    # Daily backup of both databases and the document store, kept for 14 days (deploy/backup.sh).
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: pcp
      PGPASSWORD: ${PG_PASSWORD}
      KEEP_DAYS: "14"
    entrypoint: ["sh", "/backup.sh", "loop"]
    volumes:
      - ./backup.sh:/backup.sh:ro
      - backups:/backups
      - appstorage:/storage:ro
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8088:80" # admin access only through an SSH tunnel
    depends_on:
      - keycloak
      - app

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        # The app calls Keycloak at its public address; inside the stack that name points at Caddy.
        aliases:
          - ${PUBLIC_HOST}
    depends_on:
      - nginx

volumes:
  pgdata:
  appstorage:
  backups:
  caddy_data:
  caddy_config:
