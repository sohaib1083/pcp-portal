# PCP Digitalization demo: one-server layout (Nginx -> Next.js + Keycloak, PostgreSQL)
# The Next.js app runs on the host (port 3150); Nginx proxies to it.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pcp
      POSTGRES_PASSWORD: pcp_demo_pw
      POSTGRES_DB: pcp
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcp -d pcp"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: pcp
      KC_DB_PASSWORD: pcp_demo_pw
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      # No fixed hostname: Keycloak builds its URLs from Nginx's X-Forwarded-* headers, so the same
      # server answers on http://localhost:8088 and on a public HTTPS link (./demo.sh share).
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./docker/keycloak/realm-pcp.json:/opt/keycloak/data/import/realm-pcp.json:ro
      - ./docker/keycloak/themes/pcp:/opt/keycloak/themes/pcp:ro
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - keycloak

volumes:
  pgdata:
